version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: seminar-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: seminar_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev:latest
    container_name: seminar-maildev
    restart: always
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seminar-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/seminar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_MAIL_HOST=maildev
      - SPRING_MAIL_PORT=1025
      - APP_AES_KEY=SeminarSystemSecretKey2026AES256
      - APP_FRONTEND_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      maildev:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seminar-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql-data:
