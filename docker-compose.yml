services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: material-shipment-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: material-shipment-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
