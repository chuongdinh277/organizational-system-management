<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Hậu cần - Training Inc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-primary">Dashboard Điều phối viên</h2>
        <hr>
        
        <div class="card">
            <div class="card-header bg-dark text-white">Danh sách Hội thảo sắp tới</div>
            <div class="card-body">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Mã HT</th>
                            <th>Tên/Loại Hội thảo</th>
                            <th>Ngày tổ chức</th>
                            <th>Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="hoi-thao-list">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
